name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: 'npm'
    - run: npm ci
    - run: npm test
